<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Oʻahu Pathfinder — find the right next step on Oʻahu, whether you're a tourist, a business owner, or a local.">
<meta name="theme-color" content="#cfeef5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pathfinder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Oʻahu Pathfinder — Find the right next step on Oʻahu</title>
<style>
  :root {
    --teal:    #1aa7a7;
    --green:   #4caf50;
    --orange:  #f5a623;
    --blue:    #2274b5;
    --purple:  #8b6cc1;
    --coral:   #f07057;
    --navy:    #1b3a6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--navy);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #cfeef5;
  }

  /* ---------- photo backdrop (fixed div: works on iOS where bg-attachment:fixed fails) ---------- */
  #backdrop {
    position: fixed; inset: 0; z-index: -1;
    background: url('images/bg.jpg') center / cover no-repeat;
  }
  #backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,.82) 0%,
      rgba(255,255,255,.55) 16%,
      rgba(231,247,252,.38) 45%,
      rgba(250,243,227,.62) 100%);
  }

  /* ---------- header ---------- */
  header {
    text-align: center;
    padding: max(env(safe-area-inset-top), 12px) 16px 8px;
    flex-shrink: 0;
  }
  .logo { width: 56px; height: 56px; margin: 0 auto 2px; display: block;
          filter: drop-shadow(0 2px 6px rgba(27,58,107,.25)); }
  h1 { font-size: 28px; letter-spacing: 0.5px; text-shadow: 0 1px 0 rgba(255,255,255,.8); }
  .tagline {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; color: #2c4a74; margin-top: 1px;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
  }
  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 6px auto 0; width: 200px;
    color: var(--coral); font-size: 14px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: rgba(27,58,107,.3);
  }

  /* ---------- main ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 20px 24px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  .question { text-align: center; font-size: 26px; margin: 8px 0 2px;
              text-shadow: 0 1px 0 rgba(255,255,255,.7); }
  .sub {
    text-align: center;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; color: #2c4a74; margin-bottom: 14px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .sectionhead { font-size: 21px; margin: 18px 0 10px; text-shadow: 0 1px 0 rgba(255,255,255,.7); }

  /* ---------- hero banner with slow zoom ---------- */
  .hero {
    position: relative; overflow: hidden;
    height: 130px; border-radius: 22px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(27,58,107,.3);
  }
  .hero .heroimg {
    position: absolute; inset: 0;
    background-position: center; background-size: cover;
    animation: kenburns 18s ease-in-out infinite alternate;
  }
  .hero .heroshade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,30,60,0) 30%, rgba(10,30,60,.62) 100%);
  }
  .hero .herotitle {
    position: absolute; left: 18px; right: 18px; bottom: 12px;
    color: #fff; font-size: 26px;
    text-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }

  /* ---------- photo card buttons ---------- */
  .photochip {
    position: relative; display: block; width: 100%;
    height: 120px; border: none; border-radius: 20px;
    overflow: hidden; cursor: pointer;
    margin-bottom: 14px; padding: 0;
    box-shadow: 0 5px 16px rgba(27,58,107,.3);
    transition: transform .08s ease;
    color: #fff; font-family: inherit; text-align: left;
  }
  .photochip.tall { height: 150px; }
  .photochip:active { transform: scale(.97); }
  .photochip:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .photochip .pcimg {
    position: absolute; inset: 0;
    background-position: center; background-size: cover;
    transition: transform .25s ease;
  }
  .photochip:active .pcimg { transform: scale(1.05); }
  .photochip .pcshade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,30,60,.05) 25%, rgba(10,30,60,.68) 100%);
  }
  .photochip .pclabel {
    position: absolute; left: 18px; bottom: 12px; right: 50px;
    font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .photochip.tall .pclabel { font-size: 30px; }
  .photochip .pcicon {
    position: absolute; left: 18px; top: 12px; font-size: 24px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .photochip .pcchev {
    position: absolute; right: 16px; bottom: 12px;
    font-size: 26px; opacity: .95; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  /* ---------- color buttons (for option lists without photos) ---------- */
  .btn {
    display: flex; align-items: center; gap: 16px;
    width: 100%;
    border: none; border-radius: 18px;
    padding: 19px 22px;
    margin-bottom: 13px;
    font-family: inherit;
    font-size: 23px; color: #fff; text-align: left;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(27,58,107,.28);
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn .icon { font-size: 27px; width: 40px; text-align: center; flex-shrink: 0; }
  .btn .label { flex: 1; }
  .btn .chev { font-size: 22px; opacity: .9; }
  .btn.small { font-size: 18px; padding: 14px 18px; border-radius: 14px; margin-bottom: 10px; }

  .teal   { background: linear-gradient(180deg, #25b9b4, #15938f); }
  .green  { background: linear-gradient(180deg, #5cba5f, #3e9341); }
  .orange { background: linear-gradient(180deg, #f8b234, #ec9410); }
  .blue   { background: linear-gradient(180deg, #2f86c9, #1b62a0); }
  .purple { background: linear-gradient(180deg, #9a7cd0, #7257ab); }
  .coral  { background: linear-gradient(180deg, #f4806a, #e35a40); }
  .navybtn{ background: linear-gradient(180deg, #2a4f8f, #1b3a6b); }

  /* ---------- back row ---------- */
  .backrow { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; }
  .backbtn {
    border: none; background: rgba(255,255,255,.85);
    color: var(--navy); font-size: 15px; font-weight: 600;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    padding: 9px 18px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(27,58,107,.2);
  }
  .backbtn:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

  /* ---------- result card with photo header ---------- */
  .card {
    background: rgba(255,255,255,.95);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(27,58,107,.22);
    margin-bottom: 16px;
  }
  .cardimg {
    position: relative; height: 175px; overflow: hidden;
  }
  .cardimg .ciimg {
    position: absolute; inset: 0;
    background-position: center; background-size: cover;
    animation: kenburns 18s ease-in-out infinite alternate;
  }
  .cardimg .cishade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,30,60,0) 35%, rgba(10,30,60,.7) 100%);
  }
  .cardimg h2 {
    position: absolute; left: 20px; right: 110px; bottom: 12px;
    color: #fff; font-size: 26px;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .savebtn {
    position: absolute; right: 14px; top: 12px;
    border: none; background: rgba(255,255,255,.92);
    color: var(--navy);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; font-weight: 600;
    border-radius: 999px; padding: 8px 14px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .savebtn[aria-pressed="true"] { background: #fdeae4; color: #b3402a; }
  .savebtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .cardbody { padding: 18px 24px 24px; }
  .card .meta {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; color: #3a5a86; margin-bottom: 14px;
  }
  .card ol {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px; line-height: 1.45;
    padding-left: 24px; margin-bottom: 14px;
  }
  .card ol li { margin-bottom: 8px; }
  .tip, .watch {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.4;
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
  }
  .tip   { background: #e4f6ec; color: #1d5e3a; }
  .watch { background: #fdeae4; color: #8a3520; }
  .tip b, .watch b { display: block; margin-bottom: 2px; }
  .linkbtn {
    display: block; text-align: center;
    background: var(--navy); color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px; font-weight: 600;
    text-decoration: none;
    border-radius: 14px; padding: 15px;
    margin-top: 6px;
  }
  .linkbtn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  .empty {
    text-align: center;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px; color: #3a5a86;
    background: rgba(255,255,255,.8);
    border-radius: 18px; padding: 28px 20px; margin-top: 12px;
  }

  /* ---------- photo credits screen ---------- */
  .creditrow {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.9);
    border-radius: 16px; padding: 10px;
    margin-bottom: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; color: #3a5a86;
    text-decoration: none;
  }
  .creditrow img { width: 84px; height: 56px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
  .creditrow b { color: var(--navy); display: block; font-size: 14px; }

  /* ---------- bottom nav ---------- */
  nav {
    flex-shrink: 0;
    background: rgba(255,255,255,.93);
    backdrop-filter: blur(8px);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -4px 18px rgba(27,58,107,.15);
    display: flex; justify-content: space-around;
    padding: 10px 8px max(env(safe-area-inset-bottom), 12px);
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }
  nav button {
    border: none; background: none;
    font-size: 12px; color: #7a8aa5;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; font-family: inherit;
    padding: 4px 10px; border-radius: 12px;
  }
  nav button .nicon { font-size: 22px; }
  nav button.active { color: var(--blue); font-weight: 700; }
  nav button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- entrance animation: staggered cascade ---------- */
  .screen > * { animation: fadeup .5s cubic-bezier(.2,.7,.3,1) both; }
  .screen > *:nth-child(1) { animation-delay: 0s; }
  .screen > *:nth-child(2) { animation-delay: .05s; }
  .screen > *:nth-child(3) { animation-delay: .1s; }
  .screen > *:nth-child(4) { animation-delay: .15s; }
  .screen > *:nth-child(5) { animation-delay: .2s; }
  .screen > *:nth-child(6) { animation-delay: .25s; }
  .screen > *:nth-child(7) { animation-delay: .3s; }
  .screen > *:nth-child(8) { animation-delay: .35s; }
  .screen > *:nth-child(n+9) { animation-delay: .4s; }
  @keyframes fadeup {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen > * { animation: none; }
    .hero .heroimg, .cardimg .ciimg { animation: none; }
    .btn, .photochip, .photochip .pcimg { transition: none; }
  }

  /* ---------- kiosk mode ---------- */
  body.kiosk, body.kiosk * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  html, body { overscroll-behavior: none; }
  #resetbtn {
    display: none;
    position: absolute; right: 14px; top: max(env(safe-area-inset-top), 14px);
    border: none; background: rgba(255,255,255,.85);
    color: var(--navy); font-size: 13px; font-weight: 600;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(27,58,107,.2);
  }
  body.kiosk #resetbtn { display: block; }
  #qrmodal {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(10,25,50,.55); backdrop-filter: blur(4px);
    padding: 24px;
  }
  #qrmodal.open { display: flex; }
  .qrbox {
    background: #fff; border-radius: 24px;
    padding: 26px 26px 20px; max-width: 380px; width: 100%;
    text-align: center;
    box-shadow: 0 16px 50px rgba(0,0,0,.35);
    animation: qrpop .22s cubic-bezier(.2,.7,.3,1.2);
  }
  @keyframes qrpop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  .qrbox h3 { font-size: 22px; margin-bottom: 4px; }
  .qrbox .qrsub {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; color: #3a5a86; margin-bottom: 14px;
  }
  .qrbox .qrsvg { display: flex; justify-content: center; margin-bottom: 8px; }
  .qrbox .qrsvg svg { width: 230px; height: 230px; }
  .qrbox .qrdomain {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px; color: #7a8aa5; word-break: break-all; margin-bottom: 14px;
  }
  .qrbox .qrdone {
    width: 100%;
    border: none; background: var(--navy); color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px; font-weight: 600;
    border-radius: 14px; padding: 14px; cursor: pointer;
  }
  .kcbox {
    background: linear-gradient(135deg, #1b3a6b, #2a5fa8);
    color: #fff; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.4;
  }
  .kcbox b { display: block; margin-bottom: 2px; font-size: 16px; }
  .kcbox .kcbtn {
    display: block; text-align: center;
    background: #fff; color: var(--navy);
    font-weight: 700; font-size: 15px;
    text-decoration: none;
    border-radius: 10px; padding: 11px;
    margin-top: 10px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 110px; z-index: 60;
    transform: translateX(-50%);
    background: rgba(20,40,70,.92); color: #fff;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 12px 20px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
    max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  footer.credit {
    text-align: center;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 12px; color: #44608c;
    background: rgba(255,255,255,.75);
    border-radius: 14px;
    padding: 8px 14px;
    margin-bottom: 10px;
  }
  footer.credit b { color: var(--navy); }
  footer.credit a, footer.credit .linklike {
    color: var(--navy); font-weight: 600;
    border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: inherit;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div id="backdrop" aria-hidden="true"></div>

<header>
  <button id="resetbtn" aria-label="Start a fresh session">🔄 Start over</button>
  <svg class="logo" id="logotap" viewBox="0 0 100 100" role="img" aria-label="Oʻahu Pathfinder logo">
    <circle cx="50" cy="50" r="46" fill="#dff3f7"/>
    <circle cx="68" cy="30" r="12" fill="#f5c542"/>
    <path d="M14 62 Q35 30 56 56 Q70 42 88 60 L88 70 Q50 58 14 72 Z" fill="#4e9e4e"/>
    <path d="M10 72 Q30 64 50 70 Q72 64 92 72 Q72 84 50 78 Q28 86 10 72 Z" fill="#2196b8"/>
    <path d="M30 48 Q28 30 18 24 M30 48 Q34 30 44 26 M30 48 Q22 36 12 36" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="28" y="44" width="4" height="14" rx="2" fill="#6d4c2f"/>
  </svg>
  <h1>Oʻahu Pathfinder</h1>
  <div class="tagline">Find the right next step on Oʻahu</div>
  <div class="divider" aria-hidden="true">🌺</div>
</header>

<main id="main" aria-live="polite"></main>

<nav aria-label="Main navigation">
  <button id="nav-home"    data-go="t/home"><span class="nicon" aria-hidden="true">🏠</span>Home</button>
  <button id="nav-explore" data-go="t/explore"><span class="nicon" aria-hidden="true">🧭</span>Explore</button>
  <button id="nav-alerts"  data-go="t/alerts"><span class="nicon" aria-hidden="true">⚠️</span>Alerts</button>
  <button id="nav-saved"   data-go="t/saved"><span class="nicon" aria-hidden="true">🤍</span>Saved</button>
</nav>

<noscript>
  <div style="text-align:center;padding:20px;font-family:sans-serif;">
    Oʻahu Pathfinder needs JavaScript enabled to run.
  </div>
</noscript>

<div id="qrmodal" role="dialog" aria-modal="true" aria-label="Scan this code with your phone">
  <div class="qrbox">
    <h3 id="qrtitle">Open on your phone</h3>
    <div class="qrsub">Point your phone's camera at this code</div>
    <div class="qrsvg" id="qrsvg"></div>
    <div class="qrdomain" id="qrdomain"></div>
    <button class="qrdone" data-qrdone>Done</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="qrcode.js"></script>
<script>
/* =========================================================
   CONFIG — shown in the footer of every screen.
   ========================================================= */
const CONFIG = {
  ownerName: "Kind Codex",
  ownerContact: "August@kindcodex.com",
  ownerPitch: "Want one for your business?",
  version: "1.2.0",
};

/* =========================================================
   DECISION TREE — edit this data, the app rebuilds itself.
   nodes:   question screens. hero: banner photo.
            option.go: "n/<node>" goes deeper, "r/<result>" shows an answer.
            option.img: photo card instead of a color button.
   results: answer cards. img: photo header.
   All external links verified live as of June 2026.
   ========================================================= */

const nodes = {
  root: {
    q: "Who are you?",
    sub: "We'll point you to the right next step.",
    options: [
      { label: "A Tourist",        icon: "📷", img: "images/sunset.jpg",  tall: true, go: "n/tourist"  },
      { label: "A Business Owner", icon: "💼", img: "images/skyline.jpg", tall: true, go: "n/business" },
      { label: "A Local",          icon: "🌴", img: "images/thebus.jpg",  tall: true, go: "n/local"    },
    ]
  },

  /* ---------------- TOURIST ---------------- */
  tourist: {
    q: "What do you need help with?",
    hero: "images/diamondhead.jpg",
    options: [
      { label: "Plan My Trip",       icon: "🧳", img: "images/hanauma.jpg",    go: "n/t_plan"   },
      { label: "Things To Do Today", icon: "🏝️", img: "images/lanikai.jpg",    go: "n/t_today"  },
      { label: "Get Around",         icon: "🚌", img: "images/thebus.jpg",     go: "n/t_around" },
      { label: "Stay Safe",          icon: "🛟", img: "images/northshore.jpg", go: "n/t_safe"   },
      { label: "Respect the Island", icon: "🌺", img: "images/hibiscus.jpg",   go: "n/t_respect"},
    ]
  },
  t_plan: {
    q: "How long are you here?",
    hero: "images/hanauma.jpg",
    options: [
      { label: "First Time, 1 Day",    icon: "☀️", img: "images/diamondhead.jpg", go: "r/oneday"   },
      { label: "3 Days",               icon: "🗓️", img: "images/northshore.jpg",  go: "r/threeday" },
      { label: "A Week or More",       icon: "🏖️", img: "images/pearlharbor.jpg", go: "r/week"     },
      { label: "Where Should I Stay?", icon: "🏨", img: "images/sunset.jpg",      go: "r/stay"     },
    ]
  },
  t_today: {
    q: "What sounds good today?",
    hero: "images/lanikai.jpg",
    options: [
      { label: "Beach Day",      icon: "🏄", img: "images/kailua.jpg",   go: "r/beach" },
      { label: "Local Food",     icon: "🍽️", img: "images/food.jpg",     go: "r/food"  },
      { label: "Go for a Hike",  icon: "⛰️", img: "images/hike.jpg",     go: "r/hike"  },
      { label: "Rainy Day Plan", icon: "🌧️", img: "images/hibiscus.jpg", go: "r/rainy" },
    ]
  },

/* =========================================================
   Saved items (localStorage)
   ========================================================= */
const SAVE_KEY = "op-saved-v1";
function getSaved() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
  catch { return []; }
}
function setSaved(list) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); } catch {}
}
function toggleSave(id) {
  const list = getSaved();
  const i = list.indexOf(id);
  if (i >= 0) list.splice(i, 1); else list.push(id);
  setSaved(list);
  render();
}

      <span class="pclabel">${esc(opt.label)}</span>
      <span class="pcchev" aria-hidden="true">›</span>

    <span class="icon" aria-hidden="true">${opt.icon}</span>
    <span class="label">${esc(opt.label)}</span>

function syncNav(activeId) {
  ["nav-home", "nav-explore", "nav-alerts", "nav-saved"].forEach((id) => {
    document.getElementById(id).classList.toggle("active", id === activeId);
  });
}

function render() {
  const h = (location.hash || "#t/home").slice(1);
  const slash = h.indexOf("/");
  const kind = slash > 0 ? h.slice(0, slash) : "t";
  const id = slash > 0 ? h.slice(slash + 1) : "home";

  if (kind === "n") { drawNode(id, false); syncNav("nav-home"); }
  else if (kind === "r") { drawResult(id); syncNav("nav-home"); }
  else if (id === "explore") { drawExplore(); syncNav("nav-explore"); }
  else if (id === "alerts") { drawAlerts(); syncNav("nav-alerts"); }
  else if (id === "saved") { drawSavedTab(); syncNav("nav-saved"); }
  else if (id === "credits") { drawCredits(); syncNav("nav-home"); }
  else { drawNode("root", true); syncNav("nav-home"); }
}

/* =========================================================
   KIOSK MODE — for the locked tablet (Guided Access).
   Toggle: triple-tap the logo. While ON:
   - external links & emails show a QR code instead of opening
   - session auto-resets to Home after 2 min of no touches
   - "Start over" button appears in the header
   - long-press, text selection, and pinch-zoom are blocked
   - the screen is asked to stay awake (iOS 16.4+, HTTPS)
   ========================================================= */
const KIOSK_KEY = "op-kiosk";
const IDLE_MS = 120000;

function isKiosk() {
  try { return localStorage.getItem(KIOSK_KEY) === "1"; } catch { return false; }
}
function setKiosk(on) {
  try { on ? localStorage.setItem(KIOSK_KEY, "1") : localStorage.removeItem(KIOSK_KEY); } catch {}
  applyKiosk();
  pokeIdle();
  toast(on ? "Kiosk mode ON — links show QR codes, session auto-resets"
           : "Kiosk mode OFF — links open normally");
}
function applyKiosk() {
  document.body.classList.toggle("kiosk", isKiosk());
  if (isKiosk()) requestWake();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function showQR(url, title) {
  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  document.getElementById("qrsvg").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  document.getElementById("qrtitle").textContent = title || "Open on your phone";
  document.getElementById("qrdomain").textContent = url.replace(/^mailto:/, "").split("?")[0];
  document.getElementById("qrmodal").classList.add("open");
}
function hideQR() { document.getElementById("qrmodal").classList.remove("open"); }

function resetSession() {
  setSaved([]);
  hideQR();
  if (location.hash === "#t/home" || location.hash === "") render();
  else location.hash = "t/home";
  main.scrollTop = 0;
  toast("Fresh session — aloha! 🌺");
}

/* idle auto-reset (kiosk only) */
let idleTimer;
function pokeIdle() {
  clearTimeout(idleTimer);
  if (isKiosk()) idleTimer = setTimeout(resetSession, IDLE_MS);
}
["pointerdown", "keydown", "touchstart"].forEach((ev) =>
  document.addEventListener(ev, pokeIdle, { passive: true }));

/* keep the screen awake while in kiosk mode (best effort) */
let wakeLock = null;
async function requestWake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && isKiosk()) requestWake();
});

/* triple-tap the logo to toggle kiosk mode */
let logoTaps = [];
document.getElementById("logotap").addEventListener("click", () => {
  const now = Date.now();
  logoTaps = logoTaps.filter((t) => now - t < 1200);
  logoTaps.push(now);
  if (logoTaps.length >= 3) { logoTaps = []; setKiosk(!isKiosk()); }
});
document.getElementById("resetbtn").addEventListener("click", resetSession);
document.getElementById("qrmodal").addEventListener("click", (e) => {
  if (e.target.id === "qrmodal") hideQR();
});

/* block long-press menus and pinch zoom in kiosk mode */
document.addEventListener("contextmenu", (e) => { if (isKiosk()) e.preventDefault(); });
document.addEventListener("gesturestart", (e) => { if (isKiosk()) e.preventDefault(); });

/* event delegation */
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-qrdone]")) { hideQR(); return; }
  const appqr = e.target.closest("[data-appqr]");
  if (appqr) {
    showQR(location.origin + location.pathname, "Take this app with you");
    return;
  }
  const a = e.target.closest("a[href]");
  if (a && isKiosk() && /^(https?:|mailto:)/.test(a.getAttribute("href"))) {
    e.preventDefault();
    showQR(a.href, a.getAttribute("href").startsWith("mailto:")
      ? "Email us from your phone" : "Open on your phone");
    return;
  }
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
  const back = e.target.closest("[data-back]");
  if (back) {
    if (history.length > 1) history.back();
    else location.hash = "t/home";
    return;
  }
  const save = e.target.closest("[data-save]");
  if (save) { toggleSave(save.dataset.save); }
});

window.addEventListener("hashchange", render);
applyKiosk();
pokeIdle();
render();

/* offline support */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
